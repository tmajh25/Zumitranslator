  <!-- Drag region for titlebar -->
  <div class="titlebar-drag-region"></div>

    <!-- Sidebar Navigation -->
    <div data-partial="sidebar.html"></div>

    <!-- Main Content -->

      <div data-partial="panel-settings.html"></div>

      <!-- Appearance Panel -->
      <div data-partial="panel-appearance.html"></div>
    </main>

    <!-- Modals -->
    <div data-partial="modals.html"></div>
  </div>

  <!-- Synchronously expand all modular HTML partials before application scripts initialize -->
  <script>
    (function loadPartials() {
      let maxIterations = 20;
      while (document.querySelector('[data-partial]') && maxIterations-- > 0) {
        const el = document.querySelector('[data-partial]');
        const file = el.getAttribute('data-partial');
        if (window.electronAPI && typeof window.electronAPI.getPartial === 'function') {
          const html = window.electronAPI.getPartial(file);
          el.outerHTML = html || `<!-- Missing partial: ${file} -->`;
        } else {
          console.error('window.electronAPI.getPartial not available');
          break;
        }
      }
    })();
  </script>
