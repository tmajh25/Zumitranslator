      <div id="bulkReplaceModal" class="modal hidden">
        <div class="modal-content" style="max-width: 500px;">
          <div class="modal-header">
            <h3>Thay thế hàng loạt</h3>
            <button class="icon-btn" id="closeReplaceModal">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
              </svg>

          </div>
          <div class="modal-body">
            <div class="setting-card" style="margin-bottom: 0; box-shadow: none; border: none; padding: 0;">
              <p class="panel-subtitle" style="margin-bottom: 16px;">Thay thế văn bản trong các chương đã dịch hoặc chương gốc.</p>
              
              <div class="input-group-vertical" style="margin-bottom: 12px;">
                <label class="setting-label-small">Tìm kiếm</label>
                <input type="text" id="findInput" class="setting-input" placeholder="Từ/cụm từ cần tìm...">
              </div>
              
              <div class="input-group-vertical" style="margin-bottom: 20px;">
                <label class="setting-label-small">Thay thế bằng</label>
                <input type="text" id="replaceInput" class="setting-input" placeholder="Từ/cụm từ thay thế...">
              </div>

              <div class="input-group-vertical" style="margin-bottom: 20px;">
                <label class="setting-label-small">Phạm vi thay thế</label>
                <select id="replaceScope" class="setting-input">
                  <option value="finished" selected>Chương đã dịch (Finished)</option>
                  <option value="source">Nội dung gốc (Source)</option>
                  <option value="both">Cả hai</option>
                </select>
              </div>

              <div class="setting-item-row">
                <div class="checkbox-wrapper">
                  <input type="checkbox" id="replaceCaseSensitive">
                  <label for="replaceCaseSensitive">Phân biệt hoa thường</label>
                </div>
              </div>
              
              <div class="setting-item-row" style="margin-top: 8px;">

                  <input type="checkbox" id="replaceUseRegex">
                  <label for="replaceUseRegex">Sử dụng Biểu thức chính quy (Regex)</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelReplaceBtn">Hủy</button>
            <button class="btn btn-primary" id="confirmReplaceBtn">Thực hiện thay thế</button>
          </div>
        </div>
      </div>

      <div id="epubOptimizeModal" class="modal hidden">
        <div class="modal-content" style="max-width: 480px;">

            <p class="panel-subtitle" style="margin-bottom: 14px; font-size: 13px;">Chọn các tùy chọn bạn muốn tối ưu cho tệp sách này:</p>
            <div class="setting-card" style="box-shadow: none; border: 1px solid var(--border-color); padding: 12px 14px; border-radius: 8px; margin-bottom: 0;">

                  </label>
                </div>
              </div>

              <div class="setting-item-row" style="margin-bottom: 14px; align-items: flex-start;">

                  <input type="checkbox" id="optCleanHtml" checked style="margin-top: 3px;">

                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">Gỡ bỏ các thẻ script rác và các đoạn văn trống &lt;p&gt;&lt;/p&gt; gây loãng trang sách.</div>

              <div class="setting-item-row" style="align-items: flex-start;">

                  </label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelEpubOptimizeBtn">Hủy</button>
            <button class="btn btn-primary" id="confirmEpubOptimizeBtn">Bắt đầu tối ưu</button>
          </div>
        </div>
      </div>
